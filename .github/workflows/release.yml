name: release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: mittwald-ddns
            asset: mittwald-ddns-linux-x64
          - os: windows-latest
            rid: win-x64
            executable: mittwald-ddns.exe
            asset: mittwald-ddns-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          dotnet publish MittwaldDdns/MittwaldDdns.csproj `
            --configuration Release `
            --runtime $rid `
            --self-contained true `
            --output "publish/$rid" `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Prepare release file
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $source = "publish/$rid/${{ matrix.executable }}"
          $asset = "dist/${{ matrix.asset }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $source $asset -Force

          if ($IsLinux) {
            chmod +x $asset
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mittwald-ddns-${{ matrix.rid }}
          path: dist/${{ matrix.asset }}

      - name: Upload GitHub release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"

          if [[ ! "$tag" =~ ^(v[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z, got '$tag'." >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          minor="${BASH_REMATCH[1]}"

          {
            echo "tags<<EOF"
            echo "$image:latest"
            echo "$image:$tag"
            echo "$image:$minor"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
